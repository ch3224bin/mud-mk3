spring:
  datasource:
    url: jdbc:h2:mem:mud;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      # 쿼리 수 테스트(QueryCounter)가 Hibernate 통계를 읽는다
      hibernate.generate_statistics: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

mud:
  auth:
    admin-emails: admin@example.com
  game:
    tick-enabled: false

logging:
  level:
    # 통계를 켜면 세션마다 남기는 지표 로그를 끈다
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
